name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.11.9"]

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml

      - name: Install project and recorded dependencies
        run: python -m pip install -r requirements-dev.txt -e ".[dev]"

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Check generated corpus files are not committed
        run: |
          if git ls-files --error-unmatch \
            corpus/raw \
            corpus/extracted \
            corpus/processed >/dev/null 2>&1
          then
            echo "Generated corpus files must not be committed."
            git ls-files corpus/raw corpus/extracted corpus/processed
            exit 1
          fi

      - name: Check lint
        run: python -m ruff check --output-format=github .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest